# Synthetic data generation configuration for CreditGuard.
# Every parameter the generator uses lives here; nothing is hard-coded in
# src/creditguard/data/generator.py. See docs/data_generation.md for the
# prose explanation of how these parameters combine.

seed: 42

volume:
  n_customers: 50000
  min_loans_per_customer: 1
  max_loans_per_customer: 3

dates:
  # Fixed reference point ("as of" date) rather than wall-clock "today", so that
  # the same seed + config always produces byte-identical output regardless of
  # when the generator is run.
  reference_date: "2026-08-08"
  window_months: 36
  outcome_lag_months: 12
  # Days before application_date that a supporting financial/credit snapshot is dated.
  snapshot_lag_days_min: 1
  snapshot_lag_days_max: 30

demographics:
  age:
    mean: 38.0
    std: 11.0
    min: 21
    max: 70
  dependents:
    lambda: 1.1
    max: 6
  gender:
    categories: [MALE, FEMALE, OTHER]
    probs: [0.49, 0.49, 0.02]
  marital_status:
    categories: [SINGLE, MARRIED, DIVORCED, WIDOWED]
    probs: [0.35, 0.55, 0.07, 0.03]
  education:
    categories: [HIGH_SCHOOL, GRADUATE, POSTGRADUATE, DOCTORATE]
    probs: [0.30, 0.45, 0.20, 0.05]
  employment_type:
    categories: [SALARIED, SELF_EMPLOYED, BUSINESS_OWNER, UNEMPLOYED]
    # Conditional probabilities of each employment_type given education.
    probs_given_education:
      HIGH_SCHOOL: [0.55, 0.30, 0.10, 0.05]
      GRADUATE: [0.65, 0.20, 0.12, 0.03]
      POSTGRADUATE: [0.70, 0.15, 0.13, 0.02]
      DOCTORATE: [0.60, 0.10, 0.28, 0.02]
  city_tier:
    categories: [1, 2, 3]
    probs: [0.35, 0.40, 0.25]

employment:
  years_fraction_of_max_mean: 0.55
  years_noise_std: 2.5
  unemployed_years_factor: 0.15

income:
  base_lognormal_mean_log: 12.6
  base_lognormal_sigma: 0.55
  min_annual_income: 60000
  monthly_income_noise_std: 0.02
  education_shift:
    HIGH_SCHOOL: -0.25
    GRADUATE: 0.0
    POSTGRADUATE: 0.25
    DOCTORATE: 0.40
  employment_type_shift:
    SALARIED: 0.0
    SELF_EMPLOYED: -0.05
    BUSINESS_OWNER: 0.20
    UNEMPLOYED: -1.2
  age_shift_per_year_over_25: 0.01
  city_tier_shift:
    1: 0.20
    2: 0.0
    3: -0.15

expenses:
  dti_fraction_min: 0.35
  dti_fraction_max: 0.75
  dependents_effect_per_dependent: 0.02

existing_debt:
  loan_count_lambda: 1.2
  loan_count_max: 8
  emi_income_fraction_mean: 0.12
  emi_income_fraction_std: 0.05
  loan_amount_months_of_emi_mean: 18

savings:
  months_of_income_mean: 3.0
  months_of_income_std: 2.0
  dti_penalty: 0.35
  min_balance: 0.0

assets:
  other_assets_income_multiple_max: 2.0

credit_bureau:
  months_per_adult_year_mean: 7.0
  months_noise_std: 12.0
  accounts_per_24_history_months_lambda: 1.0
  accounts_max: 20
  total_credit_limit_income_multiple_mean: 2.5
  total_credit_limit_income_multiple_std: 0.8
  utilization_alpha: 2.0
  utilization_beta: 5.0
  utilization_high_dti_shift: 0.20
  utilization_low_savings_shift: 0.15
  previous_defaults_zero_prob_base: 0.88
  previous_defaults_zero_prob_risk_sensitivity: 0.15
  previous_defaults_lambda_base: 0.3
  previous_defaults_lambda_risk_sensitivity: 0.9
  late_payments_lambda_base: 0.3
  late_payments_lambda_risk_sensitivity: 0.8
  missed_payments_lambda_base: 0.15
  missed_payments_lambda_risk_sensitivity: 0.6
  active_loans_noise_range: 1
  closed_loans_history_divisor: 18.0
  snapshot_noise_std: 0.05

loan_application:
  loan_type:
    categories: [PERSONAL, HOME, AUTO, EDUCATION, BUSINESS, CREDIT_CARD]
    probs: [0.30, 0.15, 0.20, 0.10, 0.10, 0.15]
  amount_income_multiple:
    PERSONAL: 0.5
    HOME: 4.0
    AUTO: 0.8
    EDUCATION: 0.6
    BUSINESS: 1.5
    CREDIT_CARD: 0.2
  amount_noise_sigma: 0.3
  tenure_months_range:
    PERSONAL: [12, 60]
    HOME: [120, 360]
    AUTO: [12, 84]
    EDUCATION: [12, 120]
    BUSINESS: [12, 84]
    CREDIT_CARD: [6, 36]
  base_interest_rate:
    PERSONAL: 13.0
    HOME: 8.5
    AUTO: 10.0
    EDUCATION: 9.5
    BUSINESS: 14.0
    CREDIT_CARD: 24.0
  interest_rate_risk_sensitivity: 2.5
  interest_rate_noise_std: 0.5
  loan_purpose:
    categories:
      [MEDICAL, EDUCATION, WEDDING, TRAVEL, HOME_IMPROVEMENT,
       DEBT_CONSOLIDATION, BUSINESS_EXPANSION, VEHICLE_PURCHASE, OTHER]
    probs: [0.12, 0.12, 0.08, 0.08, 0.12, 0.18, 0.10, 0.10, 0.10]
  decision_lag_days_min: 1
  decision_lag_days_max: 14

# Latent default-risk label. logit = b0 + sum(coefficients * terms) + interaction
# + gaussian noise. b0 is calibrated at generation time (bisection search) so the
# realised default rate lands at the midpoint of [target_default_rate_min, max].
label:
  target_default_rate_min: 0.08
  target_default_rate_max: 0.14
  coefficients:
    dti: 2.4
    credit_utilization: 1.8
    previous_defaults: 0.55
    late_payments_12m: 0.30
    emi_to_income: 2.0
    loan_to_income: 0.7
    log_monthly_income: 0.85
    employment_years: 0.035
    credit_history_months: 0.010
    savings_to_income: 0.45
  interaction:
    dti_x_credit_utilization: 0.9
  noise_std: 0.45

data_quality_injection:
  # Fraction of financial_profiles rows given a NULL in a NOT-NULL column
  # (total_assets) -> caught at ingest as a NOT NULL violation.
  missing_value_rate: 0.02
  # Fraction of customers duplicated (same customer_id appended again) ->
  # caught at ingest as a PRIMARY KEY violation.
  duplicate_customer_rate: 0.01
  # Fraction of customers given an out-of-range age -> caught at ingest as a
  # CHECK violation; cascades to that customer's loan/financial/credit rows.
  out_of_range_age_rate: 0.005
  # Fraction of customers given a negative annual_income/monthly_income ->
  # caught at ingest as a CHECK violation; cascades like out-of-range age.
  negative_financial_value_rate: 0.005
  # Fraction of credit_history rows given an out-of-[0,2] credit_utilization ->
  # caught at ingest as a CHECK violation.
  impossible_utilization_rate: 0.01
  # Fraction of customers given a monthly_income inconsistent with
  # annual_income / 12 (still passes all DB constraints -- a semantic issue
  # for Phase 3's validation rules to catch, not this phase's ingest).
  inconsistent_income_rate: 0.02
