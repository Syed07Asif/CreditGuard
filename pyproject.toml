[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditguard"
version = "0.1.0"
description = "CreditGuard: end-to-end credit risk scoring and monitoring platform (educational simulation, synthetic data only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.3,<2.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "mlflow>=2.14,<3.0",
    "xgboost>=2.0,<3.0",
    "imbalanced-learn>=0.12,<1.0",
    "shap>=0.45,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "streamlit>=1.35,<2.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "jupyter>=1.0",
    "nbclient>=0.10",
    "httpx>=0.27,<1.0",
    "responses>=0.25,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
